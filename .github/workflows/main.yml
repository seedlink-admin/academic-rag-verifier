name: Keep Streamlit App Awake

on:
  schedule:
    # UTC 기준 매 30분마다 실행 (하루 48번 노크)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://academic-rag-verifier.streamlit.app/
